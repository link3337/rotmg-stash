[package]
name = "rotmg-stash"
version = "1.1.9"
description = "RotMG Stash"
authors = ["link3337"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "rotmg_stash_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = ["devtools", "protocol-asset"] }
tauri-plugin-dialog = "2.8.3"
tauri-plugin-log = "2.10.1"
tauri-plugin-shell = "2.5.0"
base64 = "0.23.1"
dirs = "7.0.0"
log = "0.4.34"
rand = "0.10.3"
regex = "1.13.1"
reqwest = { version = "0.13.5", features = ["blocking", "json", "form"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
url = "2.5.8"
memmap2 = "0.9.12"
quick-xml = "0.42.0"
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-global-shortcut = "2.4.1"
